[project]
name = "modeltrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.3.2",
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
modeltrack = "modeltrack:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modeltrack"
module-root = "src"
